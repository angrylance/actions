name: The first workflow

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v7

        - name: Welcome, List and Read
          run: |
            echo "My first github actions job"
            ls -latr
            cat README.md

        - name: Generate ASCII Artwork
          run: cowsay -f dragon "Run for you life, meatbag!" >> dragon.txt

